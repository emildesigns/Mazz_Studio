<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,300;0,700;0,900;1,400&family=JetBrains+Mono&display=swap');

  :root {
    --obsidian: #0B0D11;
    --violet: #8B5CF6;
    --teal: #06B6D4;
    --white: #F8FAFC;
    --slate: #1E2029;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 1200px;
    height: 630px;
    overflow: hidden;
    background: var(--obsidian);
    font-family: 'Montserrat', sans-serif;
  }

  .card {
    position: relative;
    width: 1200px;
    height: 630px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 90px;
    background:
      radial-gradient(circle at 85% 15%, rgba(139, 92, 246, 0.22), transparent 55%),
      radial-gradient(circle at 10% 90%, rgba(6, 182, 212, 0.16), transparent 50%),
      var(--obsidian);
  }

  .grid-lines {
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(rgba(248,250,252,0.035) 1px, transparent 1px),
      linear-gradient(90deg, rgba(248,250,252,0.035) 1px, transparent 1px);
    background-size: 48px 48px;
    mask-image: linear-gradient(to bottom, transparent, black 30%, black 70%, transparent);
  }

  .content { position: relative; z-index: 2; max-width: 660px; }

  .eyebrow {
    font-family: 'JetBrains Mono', monospace;
    color: var(--teal);
    font-size: 20px;
    letter-spacing: 4px;
    margin-bottom: 28px;
    text-transform: uppercase;
  }

  .title {
    font-size: 64px;
    font-weight: 900;
    line-height: 1.08;
    color: var(--white);
    letter-spacing: -1px;
    margin-bottom: 26px;
  }

  .title .accent { color: var(--violet); }

  .subtitle {
    font-size: 24px;
    font-weight: 300;
    color: rgba(248, 250, 252, 0.75);
    line-height: 1.5;
    max-width: 560px;
  }

  .brandbar {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-top: 46px;
  }

  .brandbar .logo-text {
    font-size: 22px;
    font-weight: bold;
    letter-spacing: 2px;
    color: var(--white);
  }

  .brandbar .logo-text span {
    font-family: 'JetBrains Mono', monospace;
    color: var(--teal);
    font-size: 14px;
  }

  .mmark {
    position: relative;
    z-index: 2;
    width: 300px;
    height: 300px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .mmark svg { width: 280px; height: 280px; filter: drop-shadow(0 0 60px rgba(139, 92, 246, 0.35)); }
</style>
</head>
<body>
  <div class="card">
    <div class="grid-lines"></div>
    <div class="content">
      <div class="eyebrow">Córdoba, Argentina</div>
      <div class="title">Diseño Web &amp;<br><span class="accent">E-commerce</span> que convierte</div>
      <div class="subtitle">Páginas web y tiendas online a tu medida.</div>
      <div class="brandbar">
        <span class="logo-text">MAZZ <span>_STUDIO</span></span>
      </div>
    </div>
    <div class="mmark">
      <svg viewBox="0 0 100 100">
        <path d="M 22 76 L 22 24 L 50 56 L 78 24 L 78 76"
              fill="none" stroke="#8B5CF6" stroke-width="13"
              stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
  </div>
</body>
</html>
