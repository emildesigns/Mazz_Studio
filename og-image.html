<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<style>
  :root {
    --obsidian: #0B0D11;
    --violet: #8B5CF6;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 1200px;
    height: 630px;
    overflow: hidden;
    background: var(--obsidian);
  }

  .card {
    position: relative;
    width: 1200px;
    height: 630px;
    display: flex;
    align-items: center;
    justify-content: center;
    background:
      radial-gradient(circle at 50% 50%, rgba(139, 92, 246, 0.18), transparent 60%),
      var(--obsidian);
  }

  .mmark svg {
    width: 360px;
    height: 360px;
    filter: drop-shadow(0 0 80px rgba(139, 92, 246, 0.4));
  }
</style>
</head>
<body>
  <div class="card">
    <div class="mmark">
      <svg viewBox="0 0 100 100">
        <path d="M 22 76 L 22 24 L 50 56 L 78 24 L 78 76"
              fill="none" stroke="#8B5CF6" stroke-width="13"
              stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
  </div>
</body>
</html>
